site_name: Tenable Wiki
site_description: Tenable kurulum, operasyon ve mimari notları
site_author: Ali Okan Yüksel
site_url: https://yukselao.github.io/tenable-wiki/

repo_url: https://github.com/yukselao/tenable-wiki
repo_name: yukselao/tenable-wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Ali Okan Yüksel

theme:
  name: material
  language: tr
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    scheme: slate
    primary: black
    accent: yellow
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - tr
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Bu bölüme bağlantı
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Anasayfa: index.md
  - Managed Nessus Scanner Deployment on Red Hat OpenShift: openshift/nessus-scanner.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yukselao
      name: GitHub
  generator: false
